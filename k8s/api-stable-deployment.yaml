apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-stable
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 9
  selector:
    matchLabels:
      app: fraud-api
      version: stable
  template:
    metadata:
      labels:
        app: fraud-api
        version: stable
        component: inference
        tier: serving
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: fraud-api
          image: fraud-api:v1.0.0
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RELEASE_VERSION
              value: "stable-v1.0.0"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: fraud-api-secret
                  key: API_KEY
            - name: BATCH_TIMEOUT_MS
              value: "3"
            - name: MAX_BATCH_SIZE
              value: "128"
            - name: MAX_QUEUE_SIZE
              value: "500"
            - name: RATE_LIMIT_REQUESTS
              value: "100000"
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: "60"