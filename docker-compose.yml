x-airflow-common-env: &airflow-common-env
  AIRFLOW_HOME: /opt/airflow
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
  AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
  DATABASE_URL: postgresql+psycopg2://fraud:fraud@app-postgres:5432/fraud_predictions

x-airflow-common-volumes: &airflow-common-volumes
  - ./dags:/opt/airflow/dags
  - ./airflow_logs:/opt/airflow/logs
  - ./monitoring:/opt/airflow/monitoring
  - ./src:/opt/airflow/src
  - ./models:/opt/airflow/models
  - ./data:/opt/airflow/data
  - ./logs:/opt/airflow/project_logs
  - ./requirements-airflow.txt:/opt/airflow/requirements-airflow.txt

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: fraud-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  api:
    build: .
    container_name: fraud-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      app-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://fraud:fraud@app-postgres:5432/fraud_predictions
      BATCH_TIMEOUT_MS: 3
      MAX_BATCH_SIZE: 128
      MAX_QUEUE_SIZE: 500
      API_KEY: ${API_KEY}
      RATE_LIMIT_REQUESTS: 100000
      RATE_LIMIT_WINDOW_SECONDS: 60

  dashboard:
    build: .
    container_name: fraud-dashboard
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./scored_transactions.csv:/app/scored_transactions.csv
    depends_on:
      - api
  
  airflow-postgres:
    image: postgres:15
    container_name: fraud-airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-redis:
    image: redis:7
    container_name: fraud-airflow-redis

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: fraud-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-redis:
        condition: service_started
      app-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: >
      bash -c "
      pip install -r /opt/airflow/requirements-airflow.txt &&
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Reimo --lastname Tamme --role Admin --email tamme.reimo@gmail.com || true
      "

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: fraud-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      app-postgres:
        condition: service_started
    environment:
       <<: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: >
      bash -c "
      pip install -r /opt/airflow/requirements-airflow.txt &&
      airflow webserver
      "

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: fraud-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      app-postgres:
        condition: service_started
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: >
      bash -c "
      pip install -r /opt/airflow/requirements-airflow.txt &&
      airflow scheduler
      "
  
  airflow-worker:
    image: apache/airflow:2.10.5
    container_name: fraud-airflow-worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      app-postgres:
        condition: service_started
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: >
      bash -c "
      pip install -r /opt/airflow/requirements-airflow.txt &&
      airflow celery worker -H fraud-worker@%h
      "
    

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fraud-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fraud-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  
  app-postgres:
    image: postgres:16
    container_name: fraud-app-postgres
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_predictions"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  airflow_postgres_data:
  app_postgres_data: