name: Fraud Detection CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint code
        run: |
          ruff check src app monitoring dashboard

      - name: Run tests
        run: |
          pytest tests -q

      - name: Verify FastAPI app imports
        run: |
          python -c "from app.main import app; print('API loaded')"

      - name: Build Docker image
        run: |
          docker build -t fraud-api .

      - name: Smoke test Docker container
        run: |
          docker run -d -p 8000:8000 --name fraud-api-test fraud-api
          sleep 10
          curl -f http://localhost:8000/docs
          docker stop fraud-api-test