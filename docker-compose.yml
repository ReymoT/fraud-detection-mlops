services:
  api:
    build: .
    container_name: fraud-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      BATCH_TIMEOUT_MS: 2
      MAX_BATCH_SIZE: 128
      MAX_QUEUE_SIZE: 1000

  dashboard:
    build: .
    container_name: fraud-dashboard
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./scored_transactions.csv:/app/scored_transactions.csv
    depends_on:
      - api
  
  airflow-init:
    image: apache/airflow:2.10.5
    container_name: fraud-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW_HOME: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./monitoring:/opt/airflow/monitoring
      - ./src:/opt/airflow/src
      - ./models:/opt/airflow/models
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/project_logs
      - ./requirements-airflow.txt:/opt/airflow/requirements-airflow.txt
      - ./airflow_home:/opt/airflow
    command: >
      bash -c "
      pip install -r /opt/airflow/requirements-airflow.txt &&
      airflow db init &&
      airflow users create --username admin --password admin --firstname Reimo --lastname Tamme --role Admin --email admin@example.com || true
      "

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: fraud-airflow-webserver
    depends_on:
        airflow-init:
          condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW_HOME: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./monitoring:/opt/airflow/monitoring
      - ./src:/opt/airflow/src
      - ./models:/opt/airflow/models
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/project_logs
      - ./requirements-airflow.txt:/opt/airflow/requirements-airflow.txt
      - ./airflow_home:/opt/airflow
    ports:
      - "8080:8080"
    command: >
      bash -c "
      pip install -r /opt/airflow/requirements-airflow.txt &&
      airflow webserver
      "

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: fraud-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW_HOME: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./monitoring:/opt/airflow/monitoring
      - ./src:/opt/airflow/src
      - ./models:/opt/airflow/models
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/project_logs
      - ./requirements-airflow.txt:/opt/airflow/requirements-airflow.txt
      - ./airflow_home:/opt/airflow
    command: >
      bash -c "
      pip install -r /opt/airflow/requirements-airflow.txt &&
      airflow scheduler
      "

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fraud-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fraud-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1