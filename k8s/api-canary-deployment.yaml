apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-canary
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 1
  selector:
    matchLabels:
      app: fraud-api
      version: canary
  template:
    metadata:
      labels:
        app: fraud-api
        version: canary
        component: inference
        tier: serving
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: fraud-api
          image: us-central1-docker.pkg.dev/fraud-detection-497220/fraud-detection/fraud-api:v1.1.0-canary
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RELEASE_VERSION
              value: "canary-v1.1.0"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: fraud-api-secret
                  key: API_KEY
            - name: BATCH_TIMEOUT_MS
              value: "3"
            - name: MAX_BATCH_SIZE
              value: "256"
            - name: MAX_QUEUE_SIZE
              value: "500"
            - name: RATE_LIMIT_REQUESTS
              value: "1000"
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: "60"